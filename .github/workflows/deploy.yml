name: Preown Staging CI/CD

on:
  push:
    branches:
      - master # Triggers the robot workflow whenever you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab the latest version of your code from the repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup the correct Node.js environment in the cloud runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. FIXED: Removed "cd preown-frontend" because your files are already in the main folder
      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build

      # 4. FIXED: Changed SOURCE to "./" because everything is in the root directory
      - name: Deploy Frontend Files via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvO --delete"
          SOURCE: "./" # Copies everything built in the root folder over to the server
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/preown-front" # Make sure this folder matches Step 5 and Nginx!

      # 5. Tell PM2 on your server to reload seamlessly
      - name: Refresh Live Server Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/preown-front
            # Restart the app safely using your process name 'preown-front'
            pm2 restart preown --update-env || pm2 start npm --name "preown" -- start -- -p 3000
            pm2 save