name: Preown Staging CI/CD

on:
  push:
    branches:
      - main # Triggers the robot workflow whenever you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab the latest version of your code from the repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup the correct Node.js environment in the cloud runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install packages and compile the Next.js production build in the cloud
      - name: Install & Build Frontend
        run: |
          cd preown-frontend
          npm ci
          npm run build

      # 4. Securely sync the compiled production files straight to your Lightsail server
      - name: Deploy Frontend Files via SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvO --delete"
          SOURCE: "preown-frontend/"
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/preown-front"

      # 5. Tell PM2 on your server to reload seamlessly with zero downtime
      - name: Refresh Live Server Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/preown-front
            # Restart the app safely or start it fresh if it isn't running yet
            pm2 restart preown --update-env || pm2 start npm --name "preown" -- start -- -p 3000
            pm2 save